name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update && sudo apt-get install -y bats shellcheck
          else
            brew install bats-core shellcheck
          fi
      - name: Shellcheck
        run: shellcheck -s bash -x -e SC2034,SC2148 bin/jack lib/*.sh
      - name: Bats
        run: bats tests
